name: Reactant
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual triggering

jobs:
  reactant-test:
    # two groups of tests in parallel jobs (see SpeedyWeather/test/reactant/runtests.jl): unit tests of
    # single features and the correctness tests of whole models against the CPU
    name: Reactant ${{ matrix.tests }} tests - Julia v${{ matrix.version }}, ${{ matrix.os }}
    # don't run if any of these labels are present
    if: >
      !( 
      contains(github.event.pull_request.labels.*.name, 'skip-ci') ||
      contains(github.event.pull_request.labels.*.name, 'skip-speedyweather-ci') ||
      contains(github.event.pull_request.labels.*.name, 'skip-reactant-ci')
      )
    runs-on: ${{ matrix.os }}
    timeout-minutes: 140
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.13'
        os:
          - ubuntu-latest
        tests:
          - unit
          - correctness
    steps:
      - uses: actions/checkout@v7
      
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      
      - uses: julia-actions/cache@v3
      
      - name: Develop local packages
        run: |
          julia --color=yes --project=SpeedyWeather/test/reactant -e '
            using Pkg
            Pkg.develop([
              PackageSpec(path="SpeedyWeatherInternals"),
              PackageSpec(path="LowerTriangularArrays"),
              PackageSpec(path="RingGrids"),
              PackageSpec(path="SpeedyTransforms"),
              PackageSpec(path="SpeedyWeather")
            ])
            Pkg.instantiate()
          '
      
      - name: Run Reactant ${{ matrix.tests }} tests
        run: |
          julia --color=yes --project=SpeedyWeather/test/reactant SpeedyWeather/test/reactant/runtests.jl ${{ matrix.tests }}
        env:
          GITHUB_AUTH: ${{ secrets.GITHUB_TOKEN }}
