name: Metal GPU
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual triggering

jobs:
  test:
    name: Metal GPU - Julia v${{ matrix.version }}, ${{ matrix.os }}
    # don't run if any of these labels are present
    if: >
      !(
      contains(github.event.pull_request.labels.*.name, 'skip-ci') ||
      contains(github.event.pull_request.labels.*.name, 'skip-gpu-ci') ||
      contains(github.event.pull_request.labels.*.name, 'skip-metal-ci')
      )
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'          
        os:
          - macos-latest
        arch:
          - aarch64
    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}

      - uses: julia-actions/cache@v3

      # SpeedyWeather is resolved via the [sources] path entry in
      # SpeedyWeather/test/GPU/MetalGPU/Project.toml, which transitively pulls in
      # its monorepo siblings, so no Pkg.develop is needed here
      - name: Instantiate Metal test environment
        shell: julia --color=yes --project=SpeedyWeather/test/GPU/MetalGPU {0}
        run: |
          using Pkg
          Pkg.instantiate()

      # fail early and legibly if the runner image has no usable (paravirtual) GPU
      - name: Report Metal device
        shell: julia --color=yes --project=SpeedyWeather/test/GPU/MetalGPU {0}
        run: |
          using Metal
          try
              Metal.versioninfo()
          catch err
              @warn "Metal.versioninfo() failed" exception = err
          end
          Metal.functional() ||
              error("No functional Metal device on this runner, see the Metal.jl output above")

      - name: Run Metal GPU tests
        run: |
          julia --color=yes --project=SpeedyWeather/test/GPU/MetalGPU SpeedyWeather/test/GPU/runtests.jl
        env:
          GITHUB_AUTH: ${{ secrets.GITHUB_TOKEN }}
